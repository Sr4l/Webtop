[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dbus]
priority=10
command=dbus-daemon --system --nofork --nopidfile
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_error.log

[program:xvfb]
priority=20
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
; Large virtual framebuffer (upstream uses 8192x4096) so selkies-resize /
; --enable_resize can pick any client resolution via RANDR
command=Xvfb :1 -ac -screen 0 8192x4096x24 +extension COMPOSITE +extension DAMAGE +extension GLX +extension RANDR +extension RENDER +extension MIT-SHM +extension XFIXES +extension XTEST -noreset -nolisten tcp
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_error.log

[program:pulseaudio]
priority=30
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse"
command=/usr/bin/pulseaudio --verbose --disallow-exit --exit-idle-time=-1
autorestart=true
startdelay=2
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio_error.log

[program:kde]
priority=40
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse",PULSE_SERVER="unix:/tmp/runtime-ubuntu/pulse/native"
command=dbus-run-session startplasma-x11
autorestart=true
startdelay=5
stdout_logfile=/var/log/supervisor/kde.log
stderr_logfile=/var/log/supervisor/kde_error.log

[program:selkies]
priority=50
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",PULSE_RUNTIME_PATH="/tmp/runtime-ubuntu/pulse",PULSE_SERVER="unix:/tmp/runtime-ubuntu/pulse/native"
; Encoder alternatives (WebSocket mode): h264enc (SW x264 fallback), h264enc-striped, openh264enc, jpeg
command=selkies --addr=0.0.0.0 --port=3000 --enable_https=false --basic_auth_user=ubuntu --basic_auth_password=mypasswd --encoder=jpeg --enable_resize=true
autorestart=true
startdelay=5
stdout_logfile=/var/log/supervisor/selkies.log
stderr_logfile=/var/log/supervisor/selkies_error.log
