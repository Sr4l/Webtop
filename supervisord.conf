[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dbus]
priority=10
command=dbus-daemon --system --nofork --nopidfile
autorestart=true

[program:xvfb]
priority=20
command=Xvfb :1 -ac -screen 0 1920x1080x24 +extension GLX +extension RENDER
autorestart=true

[program:pulseaudio]
priority=30
command=pulseaudio --start --exit-idle-time=-1
autorestart=false
startdelay=2

[program:audio_setup]
priority=35
command=sh -c "sleep 3 && pactl load-module module-dummy-sink sink_name=selkies_sink && pactl set-default-sink selkies_sink"
autorestart=false
oneshot=true

[program:kde]
priority=40
command=/usr/bin/plasmashell --no-startup-id
environment=DISPLAY=":1",LIBGL_ALWAYS_SOFTWARE="0"
autorestart=true
startdelay=3

[program:selkies]
priority=50
command=python3 -m selkies.server --port=3000 --with-audio
environment=DISPLAY=":1"
autorestart=true
startdelay=4
