[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:dbus]
priority=10
command=dbus-daemon --system --nofork --nopidfile
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_error.log

[program:dbus-session]
priority=11
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu"
command=dbus-daemon --session --nofork --nopidfile --address=unix:path=/tmp/runtime-ubuntu/session-bus
autorestart=true
stdout_logfile=/var/log/supervisor/dbus_session.log
stderr_logfile=/var/log/supervisor/dbus_session_error.log

[program:pipewire]
priority=20
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/usr/bin/pipewire
autorestart=true
stdout_logfile=/var/log/supervisor/pipewire.log
stderr_logfile=/var/log/supervisor/pipewire_error.log

[program:pipewire-pulse]
priority=21
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/usr/bin/pipewire-pulse
autorestart=true
startdelay=1
stdout_logfile=/var/log/supervisor/pipewire-pulse.log
stderr_logfile=/var/log/supervisor/pipewire-pulse_error.log

[program:wireplumber]
priority=22
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/usr/bin/wireplumber
autorestart=true
startdelay=1
stdout_logfile=/var/log/supervisor/wireplumber.log
stderr_logfile=/var/log/supervisor/wireplumber_error.log

[program:null-sink]
priority=23
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "sleep 2 && /usr/bin/pactl load-module module-null-sink sink_name=output sink_properties=device.description=output && /usr/bin/pactl load-module module-null-sink sink_name=input sink_properties=device.description=input && /usr/bin/pactl set-default-sink output"
autorestart=false
startdelay=3
stdout_logfile=/var/log/supervisor/null-sink.log
stderr_logfile=/var/log/supervisor/null-sink_error.log

[program:selkies]
priority=30
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-1",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",KDE_SESSION_VERSION="6",XDG_CURRENT_DESKTOP="KDE",XDG_SESSION_DESKTOP="KDE",XDG_SESSION_TYPE="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus",PIXELFLUX_WAYLAND="true"
command=selkies --addr=0.0.0.0 --port=3000 --enable_https=false --basic_auth_user=ubuntu --basic_auth_password=mypasswd --encoder=jpeg --enable_resize=true --mode=websockets --app-wayland-display=wayland-0
autorestart=true
startdelay=3
stdout_logfile=/var/log/supervisor/selkies.log
stderr_logfile=/var/log/supervisor/selkies_error.log

; Nested KWin: connects as a client to the pixelflux capture compositor
; (wayland-1) and acts as the real window manager for the KDE session. It
; exposes wayland-0 for plasmashell/native apps and a rootless Xwayland on :1.
; Without this layer every window is mapped borderless/fullscreen directly on
; the minimal pixelflux compositor.
[program:kwin]
priority=32
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-1",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",QT_QPA_PLATFORM="wayland",DISPLAY=":1",KDE_SESSION_VERSION="6",XDG_CURRENT_DESKTOP="KDE",XDG_SESSION_DESKTOP="KDE",XDG_SESSION_TYPE="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "while [ ! -e /tmp/runtime-ubuntu/wayland-1 ]; do sleep 0.5; done; sleep 1; exec /usr/bin/python3 /usr/local/bin/kwin-xwayland.py"
autorestart=true
startdelay=4
stdout_logfile=/var/log/supervisor/kwin.log
stderr_logfile=/var/log/supervisor/kwin_error.log

[program:kactivitymanagerd]
priority=35
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",QT_QPA_PLATFORM="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "while [ ! -e /tmp/runtime-ubuntu/wayland-0 ]; do sleep 0.5; done; sleep 1; exec /usr/lib/x86_64-linux-gnu/libexec/kactivitymanagerd"
autorestart=true
startdelay=5
stdout_logfile=/var/log/supervisor/kactivity.log
stderr_logfile=/var/log/supervisor/kactivity_error.log

[program:ksmserver]
priority=36
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",KDE_SESSION_VERSION="6",QT_QPA_PLATFORM="wayland",DISPLAY=":1",XDG_CURRENT_DESKTOP="KDE",XDG_SESSION_DESKTOP="KDE",XDG_SESSION_TYPE="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "while [ ! -e /tmp/runtime-ubuntu/wayland-0 ]; do sleep 0.5; done; sleep 1; exec /usr/bin/ksmserver"
autorestart=true
startdelay=5
stdout_logfile=/var/log/supervisor/ksmserver.log
stderr_logfile=/var/log/supervisor/ksmserver_error.log

[program:polkit-agent]
priority=38
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",QT_QPA_PLATFORM="wayland",DISPLAY=":1",XDG_CURRENT_DESKTOP="KDE",XDG_SESSION_TYPE="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "while [ ! -e /tmp/runtime-ubuntu/wayland-0 ]; do sleep 0.5; done; sleep 1; exec /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1"
autorestart=true
startdelay=5
stdout_logfile=/var/log/supervisor/polkit.log
stderr_logfile=/var/log/supervisor/polkit_error.log

[program:plasmashell]
priority=40
user=ubuntu
startsecs=5
environment=HOME="/home/ubuntu",USER="ubuntu",WAYLAND_DISPLAY="wayland-0",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",KDE_SESSION_VERSION="6",QT_QPA_PLATFORM="wayland",GDK_BACKEND="wayland",DISPLAY=":1",MOZ_ENABLE_WAYLAND="0",XDG_CURRENT_DESKTOP="KDE",XDG_SESSION_DESKTOP="KDE",XDG_SESSION_TYPE="wayland",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-ubuntu/session-bus"
command=/bin/bash -c "while [ ! -e /tmp/runtime-ubuntu/wayland-0 ]; do sleep 0.5; done; sleep 2; exec /usr/bin/plasmashell"
autorestart=true
startdelay=10
stdout_logfile=/var/log/supervisor/plasmashell.log
stderr_logfile=/var/log/supervisor/plasmashell_error.log
