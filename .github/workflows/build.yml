name: Build & Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ubuntu-kde-base
  DEVENV_IMAGE: ubuntu-kde-devenv

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build -f Dockerfile.base -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:${{ github.sha }} .
      - name: Tag + Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:latest

  build-devenv:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull base image
        if: github.event_name != 'pull_request'
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:${{ github.sha }}
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker build -f Dockerfile.base -t ubuntu-kde-base .
          fi
          docker build -f Dockerfile.devenv \
            --build-arg BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BASE_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DEVENV_IMAGE }}:${{ github.sha }} .
      - name: Tag + Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DEVENV_IMAGE }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DEVENV_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DEVENV_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DEVENV_IMAGE }}:latest