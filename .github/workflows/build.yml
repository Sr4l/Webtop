name: Build & Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ubuntu-kde-base
  DEVENV_IMAGE_NAME: ubuntu-kde-devenv

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          docker build -f Dockerfile.base -t ${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} .
      - name: Tag + Push
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          docker tag ${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} ${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:latest
          docker push ${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:latest
        if: github.event_name != 'pull_request'

  build-devenv:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          docker build -f Dockerfile.devenv --build-arg BASE_IMAGE=${REGISTRY}/${REPO}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} -t ${REGISTRY}/${REPO}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA} .
      - name: Tag + Push
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          docker tag ${REGISTRY}/${REPO}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA} ${REGISTRY}/${REPO}/${{ env.DEVENV_IMAGE_NAME }}:latest
          docker push ${REGISTRY}/${REPO}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${REGISTRY}/${REPO}/${{ env.DEVENV_IMAGE_NAME }}:latest
        if: github.event_name != 'pull_request'