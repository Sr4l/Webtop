name: Build & Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: docker.io
  BASE_IMAGE_NAME: sr4l/webtop-ubuntu-kde-base
  DEVENV_IMAGE_NAME: sr4l/webtop-ubuntu-kde-devenv

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build
        run: |
          docker build -f Dockerfile.base -t ${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} .
      - name: Tag + Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} ${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:latest
          docker push ${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:latest

  build-devenv:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build
        run: |
          docker build -f Dockerfile.devenv --build-arg BASE_IMAGE=${REGISTRY}/${{ env.BASE_IMAGE_NAME }}:${GITHUB_SHA} -t ${REGISTRY}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA} .
      - name: Tag + Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${REGISTRY}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA} ${REGISTRY}/${{ env.DEVENV_IMAGE_NAME }}:latest
          docker push ${REGISTRY}/${{ env.DEVENV_IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${REGISTRY}/${{ env.DEVENV_IMAGE_NAME }}:latest